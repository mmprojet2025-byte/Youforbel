<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Modifier un spectacle</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${title}">Modifier un spectacle</h2>

    <form th:action="@{/shows/{id}/edit(id=${show.id})}"
          th:object="${show}"
          method="post"
          enctype="multipart/form-data">

        <div>
            <label>Titre :</label>
            <input type="text" th:field="*{title}">
        </div>

        <br>

        <div>
            <label>Prix :</label>
            <input type="number"
                   step="0.01"
                   th:field="*{price}">
        </div>

        <br>

        <div>
            <label>Réservable :</label>
            <input type="checkbox"
                   th:field="*{bookable}">
        </div>

        <br>

        <h3>Artistes liés</h3>

        <div th:each="artist : ${artists}">

            <label>

                <input type="checkbox"
                       name="artistIds"
                       th:value="${artist.id}"
                       th:checked="${show.artists.contains(artist)}">

                <span th:text="|${artist.firstname} ${artist.lastname}|">
                    Nom artiste
                </span>

            </label>

        </div>

        <br>

        <h3>Affiche du spectacle</h3>

        <input type="file"
               name="posterFile"
               accept="image/*">

        <br><br>

        <button type="submit">
            Enregistrer
        </button>

    </form>

    <br>

    <a th:href="@{/shows/{id}(id=${show.id})}">
        Retour au spectacle
    </a>

</div>

</body>
</html>
