<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Modifier un spectacle</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${title}">Modifier un spectacle</h2>

    <form th:action="@{/shows/{id}/edit(id=${show.id})}"
          th:object="${show}"
          method="post">

        <div>
            <label>Titre :</label>
            <input type="text" th:field="*{title}">
        </div>

        <br>

        <div>
            <label>Prix :</label>
            <input type="number" step="0.01" th:field="*{price}">
        </div>

        <br>

        <div>
            <label>Réservable :</label>
            <input type="checkbox" th:field="*{bookable}">
        </div>

        <br>

        <h3>Artistes liés</h3>

        <div th:each="artist : ${artists}">
            <label>
                <input type="checkbox"
                       name="artistIds"
                       th:value="${artist.id}">
                <span th:text="|${artist.firstname} ${artist.lastname}|">
                    Nom artiste
                </span>
            </label>
        </div>

        <br>

        <button type="submit">
            Enregistrer
        </button>

    </form>

    <br>

    <a th:href="@{/shows/{id}(id=${show.id})}">
        Retour au spectacle
    </a>

</div>

</body>
</html>
