<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Liste des spectacles</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${title}">Liste des spectacles</h2>

    <ul th:unless="${#lists.isEmpty(shows)}">
        <li th:each="show : ${shows}">
            <span th:text="${show.title}">Titre</span>

            -

            <span th:if="${show.bookable}" th:text="${show.price + ' €'}">
                Prix
            </span>

            <span th:unless="${show.bookable}">
                Non réservable
            </span>

            |

            <a th:href="@{/shows/{id}(id=${show.id})}">View</a>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(shows)}">
        Aucun spectacle trouvé.
    </p>

</div>

</body>
</html>
