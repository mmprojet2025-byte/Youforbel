<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Fiche d'un spectacle</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${show.title}">Titre</h2>

    <p th:if="${show.posterUrl}">
        <img th:src="${show.posterUrl}"
             th:alt="${show.title}"
             width="300">
    </p>

    <p>
        Description :
        <span th:text="${show.description}">Description</span>
    </p>

    <p th:if="${show.location != null}">
        Lieu :
        <span th:text="${show.location.designation}">Lieu</span>
    </p>

    <p>
        Prix :
        <span th:text="${show.price + ' €'}">Prix</span>
    </p>

    <p th:if="${show.bookable}">
        <em>Réservable</em>
    </p>

    <p th:unless="${show.bookable}">
        <em>Non réservable</em>
    </p>

    <h3>Artistes liés au spectacle</h3>

    <ul th:unless="${#lists.isEmpty(show.artists)}">
        <li th:each="artist : ${show.artists}"
            th:text="|${artist.firstname} ${artist.lastname}|">
            Nom artiste
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(show.artists)}">
        Aucun artiste lié à ce spectacle.
    </p>

    <nav>
        <a th:href="@{/shows}">
            Retour à la liste des spectacles
        </a>
    </nav>

</div>

</body>
</html>
