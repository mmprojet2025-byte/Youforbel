<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Fiche d'une représentation</title>
</head>

<body>

<div layout:fragment="content">

    <h2>Détail de la représentation</h2>

    <p>
        Spectacle :
        <span th:text="${representation.show.title}">Spectacle</span>
    </p>

    <p>
        Date :
        <span th:text="${#temporals.format(representation.schedule, 'dd/MM/yyyy')}">Date</span>
    </p>

    <p>
        Heure :
        <span th:text="${#temporals.format(representation.schedule, 'HH:mm')}">Heure</span>
    </p>

    <p>
        Lieu :
        <span th:text="${representation.location.designation}">Lieu</span>
    </p>

    <nav>
        <a th:href="@{/representations}">
            Retour à la liste des représentations
        </a>
    </nav>

</div>

</body>
</html>
