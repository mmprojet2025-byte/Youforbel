<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Fiche d'une localité</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="|${locality.postalCode} ${locality.locality}|">
        1000 Bruxelles
    </h2>

    <p>
        ID :
        <span th:text="${locality.id}">1</span>
    </p>

    <nav>
        <a th:href="@{/localities}">
            Retour à la liste des localités
        </a>
    </nav>

</div>

</body>
</html>
