<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Liste des localités</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${title}">Liste des localités</h2>

    <ul th:unless="${#lists.isEmpty(localities)}">
        <li th:each="locality : ${localities}">
            <span th:text="|${locality.postalCode} ${locality.locality}|">
                1000 Bruxelles
            </span>
            |
            <a th:href="@{/localities/{id}(id=${locality.id})}">View</a>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(localities)}">
        Aucune localité trouvée.
    </p>

</div>

</body>
</html>
