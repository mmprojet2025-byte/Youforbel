<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Liste des lieux</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${title}">Liste des lieux</h2>

    <ul th:unless="${#lists.isEmpty(locations)}">
        <li th:each="location : ${locations}">
            <span th:text="${location.designation}">Lieu</span>
            -
            <span th:text="${location.locality.locality}">Localité</span>
            |
            <a th:href="@{/locations/{id}(id=${location.id})}">View</a>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(locations)}">
        Aucun lieu trouvé.
    </p>

</div>

</body>
</html>
