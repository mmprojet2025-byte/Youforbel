<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Fiche d'un lieu</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${location.designation}">Lieu</h2>

    <p>
        Adresse :
        <span th:text="${location.address}">Adresse</span>
    </p>

    <p>
        Localité :
        <span th:text="|${location.locality.postalCode} ${location.locality.locality}|">
            1000 Bruxelles
        </span>
    </p>

    <nav>
        <a th:href="@{/locations}">
            Retour à la liste des lieux
        </a>
    </nav>

</div>

</body>
</html>
