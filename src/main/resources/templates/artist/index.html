<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/main}">

<head>
    <title>Liste des artistes</title>
</head>

<body>

<div layout:fragment="content">

    <h2 th:text="${title}">Liste des artistes</h2>

    <form th:action="@{/artists}" method="get">
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Rechercher par nom">

        <button type="submit">Rechercher</button>

        <a th:href="@{/artists}">Réinitialiser</a>
    </form>

    <br>

    <a th:href="@{/artists/new}" sec:authorize="hasRole('ADMIN')">
        <button type="button">Ajouter un artiste</button>
    </a>

    <br><br>

    <table th:unless="${#lists.isEmpty(artists)}" border="1">
        <thead>
        <tr>
            <th>Prénom</th>
            <th>Nom</th>
            <th colspan="3">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="artist : ${artists}">
            <td th:text="${artist.firstname}">Firstname</td>

            <td>
                <a th:href="@{/artists/{id}(id=${artist.id})}"
                   th:text="${artist.lastname}">
                    Lastname
                </a>
            </td>

            <td>
                <a th:href="@{/artists/{id}(id=${artist.id})}">View</a>
            </td>

            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/artists/{id}/edit(id=${artist.id})}">
                    Edit
                </a>
            </td>

            <td sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/artists/{id}/delete(id=${artist.id})}"
                      method="post"
                      style="display:inline;">
                    <button type="submit"
                            onclick="return confirm('Voulez-vous vraiment supprimer cet artiste ?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(artists)}">
        Aucun artiste trouvé.
    </p>

    <div th:if="${totalPages > 1}">

        <a th:if="${currentPage > 0}"
           th:href="@{/artists(page=${currentPage - 1}, size=5, keyword=${keyword})}">
            Précédent
        </a>

        <span>
            Page <span th:text="${currentPage + 1}">1</span>
            sur <span th:text="${totalPages}">1</span>
        </span>

        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/artists(page=${currentPage + 1}, size=5, keyword=${keyword})}">
            Suivant
        </a>

    </div>

</div>

</body>
</html>
