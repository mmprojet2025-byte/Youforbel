<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Fiche d'un artiste</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Nom complet -->
    <h2 th:text="${artist.firstname + ' ' + artist.lastname}">
        Nom de l'artiste
    </h2>

    <br>

    <!-- Bouton Modifier -->
    <a th:href="@{/artists/{id}/edit(id=${artist.id})}">
        <button type="button">Modifier</button>
    </a>

    <br><br>

    <h3>Spectacles liés à cet artiste</h3>

    <ul th:unless="${#lists.isEmpty(artist.shows)}">
        <li th:each="show : ${artist.shows}">

            <span th:text="${show.title}">
                Titre spectacle
            </span>

            |

            <a th:href="@{/shows/{id}(id=${show.id})}">
                Voir le spectacle
            </a>

        </li>
    </ul>

    <p th:if="${#lists.isEmpty(artist.shows)}">
        Aucun spectacle lié à cet artiste.
    </p>

    <br>

    <!-- Retour -->
    <a th:href="@{/artists}">
        Retour à la liste
    </a>

</div>

</body>
</html>
