<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Fiche d’un artiste</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Affiche prénom + nom -->
    <h2 th:text="|${artist.firstname} ${artist.lastname}|">
        Prénom Nom
    </h2>

    <!-- Lien retour -->
    <nav>
        <a th:href="@{/artists}">Retour à la liste</a>
    </nav>

</div>

</body>
</html>
